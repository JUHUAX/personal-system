<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人系统 · 已拦截</title>
  <script src="vendor/lucide.min.js"></script>
  <script src="appearance.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080b0f;
      color: #f1f4f7;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", Inter, system-ui, sans-serif;
      font-size: 15px;
    }
    main { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    section {
      width: min(680px, 100%);
      border: 1px solid rgba(154,199,238,0.16);
      border-radius: 20px;
      padding: 34px;
      background:
        radial-gradient(circle at 10% -20%, rgba(120,199,255,0.13), transparent 38%),
        linear-gradient(145deg, #151b22, #0f141a);
      box-shadow: 0 30px 90px rgba(0,0,0,0.58);
    }
    p.kicker {
      margin: 0 0 10px;
      color: rgba(155,216,255,0.72);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 42px); letter-spacing: -0.045em; line-height: 1.12; }
    p { color: #9eabb7; line-height: 1.75; font-size: 15px; }
    .site { color: #fff; font-weight: 900; }
    .form {
      margin-top: 22px;
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: rgba(238,238,238,0.72);
      font-size: 13px;
      font-weight: 800;
    }
    textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(154,199,238,0.16);
      border-radius: 10px;
      color: #f1f4f7;
      background: rgba(7,10,14,0.68);
      outline: none;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
    textarea:focus, select:focus, button:focus-visible {
      border-color: rgba(120,199,255,0.68);
      box-shadow: 0 0 0 4px rgba(120,199,255,0.10);
      outline: none;
    }
    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .choice {
      min-height: 42px;
      border: 1px solid rgba(154,199,238,0.16);
      border-radius: 10px;
      color: rgba(238,238,238,0.72);
      background: rgba(255,255,255,0.06);
      font-weight: 900;
      cursor: pointer;
    }
    .choice.active {
      color: #07131c;
      background: linear-gradient(180deg, #a9ddff, #74c0f6);
      border-color: rgba(170,223,255,0.82);
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .primary, .ghost {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
    }
    .primary {
      border: 1px solid rgba(170,223,255,0.82);
      color: #07131c;
      background: linear-gradient(180deg, #a9ddff, #74c0f6);
    }
    .ghost {
      border: 1px solid rgba(154,199,238,0.18);
      color: #dceaf5;
      background: rgba(255,255,255,0.035);
    }
    .primary:hover, .choice:hover { filter: brightness(1.08); }
    .ghost:hover { border-color: rgba(120,199,255,0.38); background: rgba(120,199,255,0.09); }
    .message {
      margin-top: 12px;
      color: rgba(238,238,238,0.72);
      font-size: 13px;
    }
    @media (max-width: 560px) {
      main { padding: 14px; }
      section { padding: 22px 18px; border-radius: 16px; }
      .choice-row { grid-template-columns: 1fr; }
      .actions button { flex: 1 1 120px; }
    }
  </style>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <header class="blocked-header"><div class="app-brand"><span class="brand-mark" data-icon="panels-top-left" aria-hidden="true"></span><div><strong>个人系统</strong><small>Personal System</small></div></div><div class="theme-switch" role="group" aria-label="外观主题"><button type="button" data-theme-choice="light" data-icon="sun" aria-label="浅色主题" title="浅色主题"></button><button type="button" data-theme-choice="dark" data-icon="moon" aria-label="深色主题" title="深色主题"></button></div></header>
  <main>
    <section>
      <div class="blocked-symbol" data-icon="shield-ban" aria-hidden="true"></div>
      <h1>工作阶段已拦截</h1>
      <p class="blocked-site">被拦截的网站 <span class="site" id="siteText"></span></p>

      <div class="form">
        <label>
          申请理由
          <textarea id="reasonInput" placeholder="例如：查资料 / 下载论文 / 必须登录某个工具"></textarea>
        </label>

        <label>
          申请访问时间
          <select id="minutesInput">
            <option value="5">5 分钟</option>
            <option value="10" selected>10 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
          </select>
        </label>

        <label>
          是否停止当前番茄钟
          <div class="choice-row">
            <button class="choice active" id="keepBtn" type="button">继续番茄钟</button>
            <button class="choice" id="stopBtn" type="button">停止番茄钟</button>
          </div>
        </label>

        <div class="actions">
          <button class="primary" id="applyBtn" type="button" data-icon="arrow-right">申请访问</button>
          <button class="ghost" id="backBtn" type="button" data-icon="arrow-left">返回</button>
        </div>

        <div class="message" id="message"></div>
      </div>
    </section>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
