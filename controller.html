<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人系统 · 番茄钟</title>
  <script src="vendor/lucide.min.js"></script>
  <script src="appearance.js"></script>
  <script src="controller-bootstrap.js"></script>
  <link rel="stylesheet" href="controller.css" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="timer.css" />
</head>
<body>
  <main class="controller">
    <section class="panel">
      <div class="app-brand"><span class="brand-mark" data-icon="panels-top-left" aria-hidden="true"></span><div><strong>个人系统</strong><small>Personal System</small></div></div>
      <h1>番茄钟</h1>

      <div class="button-row">
        <button class="launch" id="timelinePageButton" data-icon="layout-dashboard">打开工作台</button>
        <button class="launch" id="launchButton" data-icon="picture-in-picture-2">打开置顶小窗</button>
        
      </div>

      <div class="status-message" id="pipStatus"></div>

      <div class="fallback" id="fallback">
        当前浏览器环境不支持 Document Picture-in-Picture，无法实现置顶小窗。
      </div>

      <div class="theme-switch" role="group" aria-label="外观主题"><button type="button" data-theme-choice="light" data-icon="sun" aria-label="浅色主题" title="浅色主题"></button><button type="button" data-theme-choice="dark" data-icon="moon" aria-label="深色主题" title="深色主题"></button></div>
    </section>
  </main>

  <script src="controller.js"></script>
</body>
</html>
